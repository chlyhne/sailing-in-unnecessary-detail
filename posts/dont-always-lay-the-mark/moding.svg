<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" role="img" aria-labelledby="title desc">
  <title id="title">Two sailing modes can beat the direct course</title>
  <desc id="desc">The straight course takes 6 minutes 25 seconds. Sailing below it under gennaker, then heading up under jib, takes 6 minutes in total.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <g font-family="system-ui, sans-serif" font-size="22" fill="#223a34">
    <path d="M 65 115 H 615" fill="none" stroke="#6a716b" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="340" y="92" text-anchor="middle" fill="#6a716b">Straight to the mark: 6:25</text>
    <path d="M 65 115 L 385 183" fill="none" stroke="#30695b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 385 183 L 615 115" fill="none" stroke="#416d92" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="65" cy="115" r="5" fill="#223a34"/>
    <circle cx="615" cy="115" r="7" fill="#c18b3b"/>
    <circle cx="385" cy="183" r="5" fill="#223a34"/>
    <text x="65" y="60" text-anchor="middle">Start</text>
    <text x="615" y="60" text-anchor="middle">Mark</text>
    <text x="205" y="195" text-anchor="middle" fill="#30695b">Gennaker: 3 min</text>
    <text x="205" y="220" text-anchor="middle" fill="#30695b">10.33 kn</text>
    <text x="520" y="195" text-anchor="middle" fill="#416d92">Jib: 3 min</text>
    <text x="520" y="220" text-anchor="middle" fill="#416d92">7.95 kn</text>
    <text x="385" y="260" text-anchor="middle" font-weight="600">Change sail. Total: 6:00.</text>
  </g>
</svg>
