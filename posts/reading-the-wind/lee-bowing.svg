<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title description">
  <title id="title">Two boats in a lee-bow position</title>
  <desc id="description">Viewed from above, both boats sail towards the top of the diagram on the same tack. True wind comes from the upper right. The blue lee-bowing boat is slightly ahead and to the left, with a smiling sunglasses face overlapping its upper-right edge. The red lee-bowed boat behind and to windward has a sad face overlapping its upper-right edge. Blue means good; red means bad.</desc>
