name = "sailing-blog-comments"
main = "src/index.js"
compatibility_date = "2026-10-27"
workers_dev = true

# Every asset request must pass the owner session check, including images.
[assets]
directory = "../_owner-site"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[vars]
ADMIN_ORIGIN = "https://sailing-blog-comments.hummesse.workers.dev"
# Permanent GitHub account ID for chlyhne.
ADMIN_GITHUB_ID = "198742006"
ALLOWED_ORIGINS = "https://sailinginunnecessarydetail.com,https://www.sailinginunnecessarydetail.com"

[[d1_databases]]
binding = "DB"
database_name = "sailing-blog-comments"
database_id = "7f0f6e4e-5741-4c25-8de4-5bbc37a69610"
migrations_dir = "migrations"

[triggers]
crons = ["0 3 * * *"]
