project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
website:
  title: "Sailing in Unnecessary Detail"
  site-url: https://sailinginunnecessarydetail.com/
  description: "Sailing, flow and the occasional useful equation."
  search: false
  google-analytics: "G-87VVYGWHG8"
  cookie-consent:
    type: express
    style: simple
    palette: light
format:
  html:
    minimal: true
    css: styles.css
    lang: en
    html-math-method: mathml
    include-before-body: _includes/header.html
    include-after-body: _includes/footer.html
