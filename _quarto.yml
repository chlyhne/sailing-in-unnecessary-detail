project:
  type: website
  output-dir: _site
  resources:
    - comments.js
    - navigation.js
    - article-analytics.js
    - owner-view.js
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
website:
  title: "Sailing in Unnecessary Detail"
  site-url: https://sailinginunnecessarydetail.com/
  description: "Sailing, flow and the occasional useful equation."
  search: false
  draft-mode: unlinked
  google-analytics: "G-87VVYGWHG8"
  cookie-consent:
    type: express
    style: simple
    palette: light
format:
  html:
    minimal: true
    css: styles.css
    lang: en
    html-math-method: mathml
    include-after-body:
      - _includes/comments.html
      - _includes/footer.html
filters:
  - _filters/posts.lua
