name: Publish blog
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_odds:
        description: Check Manage2Sail now (manual override of Wednesday window and settling)
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17,47 19-22 * * 3'
      timezone: Europe/Copenhagen
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh-odds:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_odds)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Check local-time window before any Manage2Sail request
        id: window
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=(--window-only)
          if [ "$MANUAL" = true ]; then args+=(--force); fi
          python3 scripts/refresh_odds.py "${args[@]}"
      - uses: actions/cache/restore@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          path: .cache/odds
          key: odds-poll-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            odds-poll-v1-${{ github.ref_name }}-
      - name: Check new or corrected results
        id: refresh
        if: steps.window.outputs.allowed == 'true'
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=()
          if [ "$MANUAL" = true ]; then args+=(--force); fi
          python3 scripts/refresh_odds.py "${args[@]}"
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.window.outputs.allowed == 'true' && hashFiles('.cache/odds/state.json') != '' }}
        with:
          path: .cache/odds
          key: odds-poll-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-python@v5
        if: steps.refresh.outputs.changed == 'true'
        with:
          python-version: '3.11'
      - name: Install model dependencies only when results changed
        if: steps.refresh.outputs.changed == 'true'
        run: python -m pip install -r scripts/odds-requirements.txt
      - name: Rebuild and validate candidate odds
        if: steps.refresh.outputs.changed == 'true'
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m unittest discover -s test -p 'test_*odds.py'
          cp .cache/odds/candidate.csv _data/odds/results.csv
          python scripts/export_odds.py --output .cache/odds/data.json
          cp .cache/odds/data.json odds/data.json
          cp .cache/odds/candidate-identities.json _data/odds/identities.json
          node --test test/*.test.cjs
      - name: Commit only the refreshed snapshot
        id: commit
        if: steps.refresh.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/odds/results.csv _data/odds/identities.json odds/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Onsdagsbanen odds from published race results'
            git push origin "HEAD:$BRANCH"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  publish:
    needs: [refresh-odds]
    if: ${{ always() && (needs.refresh-odds.result == 'skipped' || (needs.refresh-odds.result == 'success' && needs.refresh-odds.outputs.changed == 'true')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh-odds.outputs.commit || github.sha }}
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - uses: actions/configure-pages@v5
      - name: Render blog
        run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
  check-comments:
    if: github.event_name != 'schedule' && !inputs.refresh_odds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser behavior
        run: node --test test/*.test.cjs
      - name: Check update guards
        run: python3 -m unittest discover -s test -p 'test_refresh_odds.py'
      - name: Check comments
        working-directory: comments-api
        run: |
          npm ci
          npm test
          npx wrangler deploy --dry-run
